[package]
name = "two-party-ecdsa"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
rand = { version = "0.6.5", features = ["wasm-bindgen"] }
zeroize = "1"
sha3 = "0.10"
sha2 = "0.10"
hmac = "0.12"
rayon = "1"
serde = { version = "1.0.147", features = ["derive"] }
serde_json = "1.0"
itertools = "0.10"
bit-vec = "0.6"
typetag = "0.2.3"
num-bigint = { version = "0.2.2", features = ["serde", "rand"] }
num-integer = "0.1"
num-traits = "0.2.6"
libsecp256k1 = "0.3.2"
thiserror = "1.0"
typenum = "1.13"
generic-array = "0.14"
lazy_static = "1.4"
cryptoxide = "0.1.1"
digest = "0.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.6.5"

[dev-dependencies]
serde_json = "1"

